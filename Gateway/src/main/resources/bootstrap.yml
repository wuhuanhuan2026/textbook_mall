spring:
  application:
    name: gateway-service

  # ========== Nacos 配置中心 ==========
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        refresh-enabled: true
        # 共享配置（所有微服务通用）
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
        # 扩展配置（按环境）
        extension-configs:
          - data-id: gateway-service-${spring.profiles.active}.yaml
            group: DEFAULT_GROUP
            refresh: true
      discovery:
        enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP

  # ========== 激活环境（默认dev） ==========
  profiles:
    active: dev

# ========== 日志配置 ==========
logging:
  level:
    com.alibaba.nacos: warn
    org.springframework.cloud.gateway: debug
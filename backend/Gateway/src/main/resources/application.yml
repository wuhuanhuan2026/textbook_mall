# Gateway网关模块配置
server:
  port: 8090

spring:
  application:
    name: gateway-service

  # ========== 添加 config.import ==========
  config:
    import: optional:nacos:gateway-service.yaml

  # ========== Nacos 配置 ==========
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: 127.0.0.1:8848    # ✅ 改为 127.0.0.1，避免 localhost 解析到 IPv6
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848    # ✅ 改为 127.0.0.1
        ip: 127.0.0.1                  # ✅ 改成 127.0.0.1（回环地址）
        port: 8090                     # ✅ 强制指定网关端口
        namespace: public
        group: DEFAULT_GROUP

    # ========== Gateway 路由配置 ==========
    gateway:
      enabled: true
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # ===== 用户服务 =====
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@ipKeyResolver}'
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # ===== 分类服务 =====
        - id: category-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1

        # ===== 图书服务 =====
        - id: book-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/books/**
          filters:
            - StripPrefix=1

        # ===== 图书服务 - 图片静态资源（✅ 新增） =====
        - id: book-service-images
          uri: http://localhost:8083
          predicates:
            - Path=/images/**
          filters:
            - StripPrefix=0

        # ===== 购物车服务 =====
        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1

        # ===== 订单服务 =====
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # ===== 支付服务 =====
        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1

        # ===== 管理员服务 =====
        - id: admin-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        # ===== 地址服务 =====
        - id: address-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/address/**
          filters:
            - StripPrefix=1

        # ===== 评价服务 =====
        - id: review-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/review/**
          filters:
            - StripPrefix=1

  # ========== Redis配置（限流） ==========
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # ========== Jackson配置 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# ========== 日志配置 ==========
logging:
  level:
    com.bookmall.gateway: debug
    org.springframework.cloud.gateway: info
    org.springframework.web: info
    com.alibaba.nacos: warn

# ========== JWT配置 ==========
jwt:
  secret: book-mall-jwt-secret-key-2024-secure
  expiration: 604800000

# ========== 白名单路径（无需认证） ==========
auth:
  whitelist:
    # ===== 用户认证接口 =====
    - /api/user/login
    - /api/user/register
    - /api/user/captcha
    - /api/user/send-code
    - /api/user/forgot-password
    - /api/user/check-username

    # ===== 用户内部调用（不需要Token） =====
    - /api/user/exists/**
    - /api/user/info/**
    - /api/user/balance/**

    # ===== 管理员登录 =====
    - /api/admin/login

    # ===== 商品公开接口 =====
    - /api/books
    - /api/books/
    - /api/books/**
    - /api/categories
    - /api/categories/
    - /api/categories/**

    # ===== 评价公开接口 =====
    - /api/review/list
    - /api/review/list/**
    - /api/review/detail/**

    # ===== 支付回调（外部系统调用） =====
    - /api/payment/callback/**

    # ===== 静态图片资源（✅ 新增） =====
    - /images
    - /images/
    - /images/**

    # ===== Swagger API文档 =====
    - /swagger-ui/**
    - /v3/api-docs/**
    - /doc.html
    - /webjars/**

    # ===== 其他公共资源 =====
    - /favicon.ico
    - /error
    - /actuator/**
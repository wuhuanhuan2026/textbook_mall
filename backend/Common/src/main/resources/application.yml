# Common模块公共配置
# 此文件会被各微服务引用，提供通用配置

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # Redis配置（各微服务可覆盖）
  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:CHANGE_TO_A_LONG_RANDOM_VALUE}
  expiration: 604800000  # 7天（毫秒）

# 密码加密配置
password:
  bcrypt:
    strength: 10

# 验证码配置
captcha:
  length: 4                # 验证码位数
  expire-time: 5           # 过期时间（分钟）
  send-interval: 60        # 发送间隔（秒）

# 分页配置
page:
  default-size: 10
  max-size: 100

# 日志配置
logging:
  level:
    com.bookmall: debug
    com.bookmall.common: debug
    org.springframework.web: info
    org.springframework.data.redis: info
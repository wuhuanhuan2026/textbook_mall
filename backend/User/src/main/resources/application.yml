# User模块配置
server:
  port: 8081

spring:
  application:
    name: user-service

  # ========== 添加 config.import ==========
  config:
    import: optional:nacos:user-service.yaml  # 从 Nacos 导入配置

  # ========== Nacos 配置 ==========
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1                   # ✅ 改成 127.0.0.1（回环地址）
        port: 8081
        namespace: public
        group: DEFAULT_GROUP

  # ========== 数据源配置 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/book_mall?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

  # ========== Redis配置 ==========
  redis:
    host: localhost
    port: 6379
    database: 1
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # ========== Jackson配置 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# ========== 日志配置 ==========
logging:
  level:
    com.bookmall.user: debug
    com.bookmall.common: debug
    org.springframework.web: info
    org.springframework.data.redis: info
    com.alibaba.nacos: warn

# ========== JWT配置 ==========
jwt:
  secret: book-mall-jwt-secret-key-2024-secure
  expiration: 604800000

# ========== MyBatis-Plus配置 ==========
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bookmall.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl